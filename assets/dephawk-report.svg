<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <!-- window -->
  <rect x="0" y="0" width="760" height="372" rx="12" fill="#0b0e14"/>
  <rect x="0" y="0" width="760" height="36" rx="12" fill="#141925"/>
  <rect x="0" y="24" width="760" height="12" fill="#141925"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="380" y="23" fill="#5a6577" text-anchor="middle" font-size="13">dephawk — run npm test</text>

  <!-- prompt -->
  <text x="24" y="72" fill="#5a6577">$</text>
  <text x="40" y="72" fill="#e6e6e6">npx dephawk run npm test</text>

  <!-- title -->
  <text x="24" y="112" fill="#e6e6e6" font-weight="bold">🦅 dephawk report — </text>
  <text x="250" y="112" fill="#ffffff" font-weight="bold">1 package</text>
  <text x="345" y="112" fill="#e6e6e6"> touched something sensitive</text>

  <!-- rows -->
  <text x="42" y="152" fill="#ff6b6b">🚨</text>
  <text x="76" y="152" fill="#ff6b6b" font-weight="bold">sneaky-dependency</text>
  <text x="250" y="152" fill="#5a6577">→</text>
  <text x="280" y="152" fill="#6ee7ff">read</text>
  <text x="352" y="152" fill="#b8c0d0">/Users/you/.ssh/id_rsa_…</text>

  <text x="42" y="182" fill="#ff6b6b">🚨</text>
  <text x="76" y="182" fill="#ff6b6b" font-weight="bold">sneaky-dependency</text>
  <text x="250" y="182" fill="#5a6577">→</text>
  <text x="280" y="182" fill="#6ee7ff">env</text>
  <text x="352" y="182" fill="#b8c0d0">NPM_TOKEN</text>

  <text x="42" y="212" fill="#ff6b6b">🚨</text>
  <text x="76" y="212" fill="#ff6b6b" font-weight="bold">sneaky-dependency</text>
  <text x="250" y="212" fill="#5a6577">→</text>
  <text x="280" y="212" fill="#6ee7ff">connect</text>
  <text x="352" y="212" fill="#b8c0d0">https://collector.dephawk-demo.invalid/exfil</text>

  <!-- normal -->
  <text x="42" y="256" fill="#4ade80">✔️</text>
  <text x="76" y="256" fill="#8b93a7">0 other calls looked normal</text>

  <!-- hint -->
  <text x="24" y="300" fill="#8b93a7">Run in enforce mode to block these →  </text>
  <text x="380" y="300" fill="#e6e6e6" font-weight="bold">DEPHAWK_MODE=enforce</text>

  <!-- report path -->
  <text x="24" y="340" fill="#5a6577">dephawk: HTML report written to .dephawk/report.html</text>
</svg>
