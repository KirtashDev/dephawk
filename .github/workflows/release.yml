name: Release

# Publishing happens from here and nowhere else, and without a credential.
#
# npm is configured to trust this repository and this workflow file directly
# (trusted publishing, OIDC), so there is no long-lived npm token to store, leak
# or rotate — the runner proves who it is per run. `publishConfig.provenance` in
# package.json then attaches a signed attestation linking the tarball on npm
# back to this run and this commit. Both need a supported CI, so a local
# `npm publish` refuses rather than quietly shipping something unattested.
#
# Matching full versions only (`v0.4.0`), not `v*`: the GitHub Action in this
# repository is consumed by tag, so a floating `v0`/`v1` tag may be moved onto a
# release at any time, and that must not try to publish a version called "1".
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token npm exchanges for the provenance attestation.
      id-token: write
      # Creating the GitHub release.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Points npm at the public registry.
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a newer npm than Node 22 ships with.
      - name: Use a recent npm
        run: npm install --global npm@latest

      - run: npm ci

      # The tag is what gets published, so it is what gets verified — not main.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # A tag pointing at a commit whose package.json says something else would
      # publish a version nobody can trace back to it. Cheap to check, and the
      # kind of mistake that is only obvious afterwards.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      # No token: authentication is the OIDC exchange npm does with the
      # `id-token` permission above.
      - name: Publish
        run: npm publish

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \[${version}\]/{flag=1; next} /^## \[/{flag=0} flag" \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG section for ${version}"
            echo "See CHANGELOG.md." > release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
