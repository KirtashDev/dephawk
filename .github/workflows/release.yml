name: Release

# Publishing happens from here and nowhere else. `publishConfig.provenance` in
# package.json makes npm attach a signed provenance attestation linking the
# tarball on npm back to this workflow run and this commit — which is only
# possible in a supported CI with an OIDC token, so a local `npm publish` will
# refuse rather than quietly ship something unattested.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token npm exchanges for the provenance attestation.
      id-token: write
      # Creating the GitHub release.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Points npm at the public registry and wires NODE_AUTH_TOKEN in.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag is what gets published, so it is what gets verified — not main.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # A tag pointing at a commit whose package.json says something else would
      # publish a version nobody can trace back to it. Cheap to check, and the
      # kind of mistake that is only obvious afterwards.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \[${version}\]/{flag=1; next} /^## \[/{flag=0} flag" \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG section for ${version}"
            echo "See CHANGELOG.md." > release-notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
